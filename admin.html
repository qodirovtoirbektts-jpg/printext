<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PRINTEXT Admin</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            background: #f5f7fb;
            margin: 0;
        }

        .admin-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin: 0;
        }

        .admin-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .admin-login {
            max-width: 450px;
            margin: 80px auto;
        }

        .admin-form {
            display: grid;
            gap: 15px;
        }

        .admin-form input,
        .admin-form select,
        .admin-form textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .admin-button {
            border: 0;
            border-radius: 10px;
            padding: 13px 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
        }

        .admin-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .admin-primary {
            background: #111827;
            color: white;
        }

        .admin-danger {
            background: #dc2626;
            color: white;
        }

        .admin-products {
            display: grid;
            gap: 15px;
            margin-top: 25px;
        }

        .admin-product {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
        }

        .admin-product img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 10px;
            background: #f3f4f6;
        }

        .admin-product-info {
            flex: 1;
            min-width: 0;
        }

        .admin-product-info h3 {
            margin: 0 0 5px;
        }

        .admin-product-info p {
            margin: 3px 0;
            color: #6b7280;
        }

        .admin-actions {
            display: flex;
            gap: 8px;
        }

        .hidden {
            display: none !important;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #f3f4f6;
            color: #374151;
            word-break: break-word;
        }

        .success-message {
            background: #ecfdf5;
            color: #065f46;
        }

        .error-message {
            background: #fef2f2;
            color: #991b1b;
        }

        .loading {
            padding: 25px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 650px) {

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-product {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-product img {
                width: 100%;
                height: 180px;
            }

            .admin-actions {
                width: 100%;
            }

            .admin-actions button {
                flex: 1;
            }

        }

    </style>

</head>


<body>


<div class="admin-page">


    <!-- LOGIN -->

    <section
        id="loginSection"
        class="admin-card admin-login"
    >

        <h1>
            PRINTEXT Admin
        </h1>

        <p>
            Administrator paneliga kirish
        </p>


        <form
            id="loginForm"
            class="admin-form"
        >

            <input
                type="email"
                id="adminEmail"
                placeholder="Email"
                autocomplete="email"
                required
            >


            <input
                type="password"
                id="adminPassword"
                placeholder="Parol"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="loginButton"
                class="admin-button admin-primary"
            >
                Kirish
            </button>

        </form>


        <p
            id="loginMessage"
            class="message hidden"
        ></p>

    </section>



    <!-- ADMIN PANEL -->

    <section
        id="adminSection"
        class="hidden"
    >

        <div class="admin-header">

            <div>

                <h1>
                    PRINTEXT Admin
                </h1>

                <p>
                    Printerlar boshqaruvi
                </p>

            </div>


            <button
                type="button"
                id="logoutButton"
                class="admin-button admin-danger"
            >
                Chiqish
            </button>

        </div>



        <div class="admin-card">

            <h2>
                Printerlar
            </h2>

            <p id="productCount">
                Yuklanmoqda...
            </p>


            <div
                id="adminProducts"
                class="admin-products"
            >

                <div class="loading">
                    Printerlar yuklanmoqda...
                </div>

            </div>

        </div>

    </section>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =========================================
   SUPABASE
========================================= */


const SUPABASE_URL =
    "https://rgqnxoofgxmidpxjiurq.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_006NOIZmoNxQNnk4vK27vQ_-88A2S6i";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* =========================================
   ELEMENTLAR
========================================= */


const loginSection =
    document.getElementById(
        "loginSection"
    );


const adminSection =
    document.getElementById(
        "adminSection"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginMessage =
    document.getElementById(
        "loginMessage"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const adminProducts =
    document.getElementById(
        "adminProducts"
    );


const productCount =
    document.getElementById(
        "productCount"
    );



/* =========================================
   MESSAGE
========================================= */


function showLoginMessage(
    message,
    type = "normal"
) {

    loginMessage.textContent =
        message;

    loginMessage.classList.remove(
        "hidden",
        "error-message",
        "success-message"
    );

    if (type === "error") {

        loginMessage.classList.add(
            "error-message"
        );

    }

    if (type === "success") {

        loginMessage.classList.add(
            "success-message"
        );

    }

}



/* =========================================
   LOGIN
========================================= */


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById(
                    "adminEmail"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "adminPassword"
                )
                .value;


        loginButton.disabled =
            true;


        loginButton.textContent =
            "Kirilmoqda...";


        showLoginMessage(
            "Kirish tekshirilmoqda..."
        );


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );

                showLoginMessage(
                    "XATO: " +
                    error.message,
                    "error"
                );

                return;

            }


            if (
                !data ||
                !data.session
            ) {

                showLoginMessage(
                    "Login amalga oshmadi. Session topilmadi.",
                    "error"
                );

                return;

            }


            console.log(
                "LOGIN SUCCESS:",
                data.user
            );


            loginForm.reset();


            loginMessage.classList.add(
                "hidden"
            );


            showAdmin();


            await loadAdminProducts();

        }

        catch (error) {

            console.error(
                "LOGIN EXCEPTION:",
                error
            );

            showLoginMessage(
                "XATO: " +
                error.message,
                "error"
            );

        }

        finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Kirish";

        }

    }
);



/* =========================================
   SHOW ADMIN
========================================= */


function showAdmin() {

    loginSection.classList.add(
        "hidden"
    );

    adminSection.classList.remove(
        "hidden"
    );

}



/* =========================================
   LOGOUT
========================================= */


logoutButton.addEventListener(
    "click",
    async function() {

        await supabaseClient.auth.signOut();


        adminSection.classList.add(
            "hidden"
        );


        loginSection.classList.remove(
            "hidden"
        );


        adminProducts.innerHTML =
            "";


        productCount.textContent =
            "Yuklanmoqda...";

    }
);



/* =========================================
   PRODUCTS
========================================= */


async function loadAdminProducts() {

    productCount.textContent =
        "Printerlar yuklanmoqda...";


    adminProducts.innerHTML = `
        <div class="loading">
            Supabase'dan printerlar olinmoqda...
        </div>
    `;


    try {

        console.log(
            "PRODUCTS: so'rov yuborilmoqda..."
        );


        const {
            data,
            error
        } =
            await supabaseClient
                .from("products")
                .select("*")
                .order(
                    "id",
                    {
                        ascending: true
                    }
                );


        console.log(
            "PRODUCTS DATA:",
            data
        );


        console.log(
            "PRODUCTS ERROR:",
            error
        );


        if (error) {

            console.error(
                "PRODUCT LOAD ERROR:",
                error
            );


            productCount.textContent =
                "Mahsulotlarni yuklashda xatolik";


            adminProducts.innerHTML = `
                <div class="message error-message">
                    <strong>Supabase xatosi:</strong><br>
                    ${escapeHtml(error.message)}
                    <br><br>
                    <strong>Code:</strong>
                    ${escapeHtml(error.code || "Noma'lum")}
                </div>
            `;

            return;

        }


        if (
            !data ||
            data.length === 0
        ) {

            productCount.textContent =
                "0 ta printer";


            adminProducts.innerHTML = `
                <div class="message">
                    Supabase'da printer topilmadi.
                </div>
            `;

            return;

        }


        productCount.textContent =
            data.length +
            " ta printer";


        adminProducts.innerHTML =
            "";


        data.forEach(
            product => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "admin-product";


                item.innerHTML = `

                    <img
                        src="${escapeAttribute(product.image || "")}"
                        alt="${escapeAttribute(product.name || "Printer")}"
                        onerror="this.style.opacity='0.3'"
                    >

                    <div class="admin-product-info">

                        <h3>
                            ${escapeHtml(product.name || "")}
                        </h3>

                        <p>
                            Brend:
                            ${escapeHtml(product.brand || "")}
                        </p>

                        <p>
                            Kategoriya:
                            ${escapeHtml(product.category || "")}
                        </p>

                        <p>
                            Narx:
                            ${Number(
                                product.price || 0
                            ).toLocaleString("uz-UZ")}
                            so‘m
                        </p>

                        <p>
                            Ombor:
                            ${Number(
                                product.stock || 0
                            )}
                            dona
                        </p>

                        ${
                            product.badge
                                ? `
                                    <p>
                                        Belgisi:
                                        ${escapeHtml(product.badge)}
                                    </p>
                                  `
                                : ""
                        }

                    </div>


                    <div class="admin-actions">

                        <button
                            type="button"
                            class="admin-button admin-primary"
                            disabled
                            title="Keyingi bosqichda yoqiladi"
                        >
                            Tahrirlash
                        </button>


                        <button
                            type="button"
                            class="admin-button admin-danger"
                            disabled
                            title="Keyingi bosqichda yoqiladi"
                        >
                            O‘chirish
                        </button>

                    </div>

                `;


                adminProducts.appendChild(
                    item
                );

            }
        );

    }

    catch (error) {

        console.error(
            "PRODUCT EXCEPTION:",
            error
        );


        productCount.textContent =
            "Xatolik yuz berdi";


        adminProducts.innerHTML = `
            <div class="message error-message">
                <strong>JavaScript xatosi:</strong><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}



/* =========================================
   XAVFSIZ TEXT
========================================= */


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

    return escapeHtml(value);

}



/* =========================================
   SESSION CHECK
========================================= */


async function checkSession() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "SESSION ERROR:",
                error
            );

            return;

        }


        if (
            data &&
            data.session
        ) {

            console.log(
                "SESSION TOPILDI"
            );


            showAdmin();


            await loadAdminProducts();

        }

    }

    catch (error) {

        console.error(
            "SESSION EXCEPTION:",
            error
        );

    }

}



/* =========================================
   START
========================================= */


checkSession();

</script>


</body>

</html>
