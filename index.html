<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HP Printerlar va Texnika Do'koni</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome piktogrammalari -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- TOP BAR / HEADER -->
  <header class="bg-white border-b sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <!-- Logo -->
      <div class="flex items-center gap-2 cursor-pointer">
        <div class="bg-blue-600 text-white font-black text-xl p-2 rounded-lg tracking-wider">HP</div>
        <span class="font-bold text-xl text-slate-800 hidden sm:inline">Store Uzbekistan</span>
      </div>

      <!-- Qidiruv paneli -->
      <div class="flex-1 max-w-xl relative">
        <input type="text" id="searchInput" placeholder="Printerlar, model yoki xususiyat bo'yicha qidiring..." 
               class="w-full bg-slate-100 border border-slate-200 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-slate-400 text-sm"></i>
      </div>

      <!-- Savatcha tugmasi -->
      <button id="cartBtn" class="relative bg-slate-100 hover:bg-slate-200 p-2.5 rounded-full transition flex items-center justify-center">
        <i class="fa-solid fa-cart-shopping text-slate-700 text-lg"></i>
        <span id="cartBadge" class="absolute -top-1 -right-1 bg-blue-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="max-w-7xl mx-auto px-4 py-6 flex-1 flex flex-col md:flex-row gap-6 w-full">

    <!-- CHAP PANEL: FILTRLAR -->
    <aside class="w-full md:w-64 bg-white p-5 rounded-xl border border-slate-200 shadow-sm h-fit shrink-0">
      <div class="flex items-center justify-between mb-4 pb-3 border-b">
        <h2 class="font-bold text-base text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-filter text-blue-600"></i> Filtrlar
        </h2>
        <button id="resetFilters" class="text-xs text-blue-600 hover:underline font-medium">Tozalash</button>
      </div>

      <!-- Narx filtri -->
      <div class="mb-6">
        <h3 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-3">Narx (USD)</h3>
        <div class="flex items-center gap-2 mb-3">
          <input type="number" id="minPrice" placeholder="Min" class="w-full border border-slate-200 px-2.5 py-1.5 text-sm rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
          <span class="text-slate-400">—</span>
          <input type="number" id="maxPrice" placeholder="Maks" class="w-full border border-slate-200 px-2.5 py-1.5 text-sm rounded-lg focus:ring-1 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <!-- Rang Chiqishi -->
      <div class="mb-6">
        <h3 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-3">Rang Chiqishi</h3>
        <div class="space-y-2 text-sm">
          <label class="flex items-center justify-between cursor-pointer group">
            <span class="flex items-center gap-2 group-hover:text-blue-600">
              <input type="checkbox" value="Rangli" class="color-filter rounded border-slate-300 text-blue-600 focus:ring-blue-500"> Rangli
            </span>
            <span class="text-xs text-slate-400">(2)</span>
          </label>
          <label class="flex items-center justify-between cursor-pointer group">
            <span class="flex items-center gap-2 group-hover:text-blue-600">
              <input type="checkbox" value="Qora va oq" class="color-filter rounded border-slate-300 text-blue-600 focus:ring-blue-500"> Qora va oq
            </span>
            <span class="text-xs text-slate-400">(1)</span>
          </label>
        </div>
      </div>

      <!-- Funksiyalar -->
      <div>
        <h3 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-3">Funksiyalar</h3>
        <div class="space-y-2 text-sm">
          <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
            <input type="checkbox" value="MFP" class="feature-filter rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span>Ko'p funksiyali (MFP)</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
            <input type="checkbox" value="Simsiz" class="feature-filter rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span>Simsiz (Wi-Fi)</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
            <input type="checkbox" value="AI" class="feature-filter rounded border-slate-300 text-blue-600 focus:ring-blue-500">
            <span>Sun'iy Intellekt (AI)</span>
          </label>
        </div>
      </div>
    </aside>

    <!-- O'NG PANEL: MAHSULOTLAR RO'YXATI -->
    <main class="flex-1 flex flex-col gap-4">
      <!-- Saralash va Natija Soni -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="text-sm text-slate-600">
          Jami topildi: <span id="productCount" class="font-bold text-slate-900">0</span> ta mahsulot
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <label for="sortBy" class="text-sm text-slate-500 whitespace-nowrap">Saralash:</label>
          <select id="sortBy" class="bg-slate-50 border border-slate-200 text-sm rounded-lg p-2 focus:ring-1 focus:ring-blue-500 outline-none w-full sm:w-auto">
            <option value="default">O'z holicha</option>
            <option value="price-low">Narx: Arzondan Qimmatga</option>
            <option value="price-high">Narx: Qimmatdan Arsonga</option>
            <option value="rating">Reyting bo'yicha</option>
          </select>
        </div>
      </div>

      <!-- Mahsulotlar Gridi -->
      <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Mahsulotlar JS orqali dinamik yuklanadi -->
      </div>
    </main>
  </div>

  <!-- TAFSILOTLAR MODAL OYNASI -->
  <div id="detailModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative animate-fade-in max-h-[90vh] overflow-y-auto">
      <button id="closeModal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-xl w-8 h-8 rounded-full flex items-center justify-center bg-slate-100">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="modalContent">
        <!-- JS orqali to'ldiriladi -->
      </div>
    </div>
  </div>

  <!-- SAVATCHA MODAL OYNASI -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex justify-end hidden">
    <div class="bg-white w-full max-w-md h-full p-6 shadow-2xl flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between pb-4 border-b mb-4">
          <h2 class="font-bold text-lg text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-cart-shopping text-blue-600"></i> Savatcha
          </h2>
          <button id="closeCart" class="text-slate-400 hover:text-slate-700 text-lg">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="cartItems" class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
          <!-- Savatcha elementlari JS orqali -->
        </div>
      </div>

      <div class="border-t pt-4">
        <div class="flex items-center justify-between font-bold text-lg mb-4 text-slate-900">
          <span>Umumiy Summa:</span>
          <span id="cartTotal">$0.00</span>
        </div>
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-500/20">
          Buyurtmani Rasmiylashtirish
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT KODI -->
  <script>
    // Mahsulotlar bazasi
    const products = [
      {
        id: 1,
        title: "HP Color LaserJet Enterprise Flow MFP 6800zfsw",
        subtitle: "Sun'iy intellektga ega ko'p funksiyali printer",
        price: 6959.00,
        oldPrice: null,
        rating: 3.5,
        reviewsCount: 2,
        colorType: "Rangli",
        features: ["MFP", "AI"],
        image: "https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=400&q=80",
        description: "Chop etish, nusxalash, skanerlash va faks (simsiz ixtiyoriy). Harfni chop etish tezligi 55 ppm gacha (qora va rangli). Avtomatik dupleks chop etish, 150 varaqli ADF, 3x550 varaqli qog'oz patnislar."
      },
      {
        id: 2,
        title: "HP Color LaserJet Pro MFP 4301fdw",
        subtitle: "Simsiz printeri, AI qobiliyatiga ega",
        price: 759.00,
        oldPrice: 859.00,
        rating: 4.5,
        reviewsCount: 414,
        colorType: "Rangli",
        features: ["MFP", "Simsiz", "AI"],
        image: "https://images.unsplash.com/photo-1588854337236-6889d631faa8?auto=format&fit=crop&w=400&q=80",
        description: "Professional sifatli rangli chop etish uchun ajoyib tezlik. Rangli chop etish, skanerlash, nusxalash, faks. Simsiz, otmetka, avtomatik 2 tomonlama chop etish. HP Wolf Pro xavfsizligi."
      },
      {
        id: 3,
        title: "HP OfficeJet Pro 9125 All-in-One",
        subtitle: "3 oylik bepul tezkor siyoh bilan, AI qobiliyatiga ega",
        price: 189.99,
        oldPrice: 309.99,
        rating: 4.2,
        reviewsCount: 403,
        colorType: "Rangli",
        features: ["MFP", "Simsiz"],
        image: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=400&q=80",
        description: "HP'ning eng tezkor inkjet printeri! Chop etish tezligi daqiqasiga 22 sahifagacha bo'lganligi sababli unumdorlikni oshiring. Chop etish, nusxalash, skanerlash, faks, 2 tomonlama bosma."
      },
      {
        id: 4,
        title: "HP LaserJet Pro M404dn",
        subtitle: "Yuqori tezlikdagi mono printer",
        price: 299.00,
        oldPrice: 349.00,
        rating: 4.8,
        reviewsCount: 120,
        colorType: "Qora va oq",
        features: ["Simsiz"],
        image: "https://images.unsplash.com/photo-1612815154858-60aa4c59eaa6?auto=format&fit=crop&w=400&q=80",
        description: "Faqat qora va oq rangda o'ta tez chop etish imkoniyati. Tarmoqqa ulanish, energiyani tejash va ixcham hajm."
      }
    ];

    let cart = [];

    // DOM Elementlari
    const productsGrid = document.getElementById('productsGrid');
    const productCount = document.getElementById('productCount');
    const searchInput = document.getElementById('searchInput');
    const sortBy = document.getElementById('sortBy');
    const minPrice = document.getElementById('minPrice');
    const maxPrice = document.getElementById('maxPrice');
    const resetFiltersBtn = document.getElementById('resetFilters');

    // Mahsulotlarni ekranga chiqarish
    function renderProducts(items) {
      productCount.textContent = items.length;
      productsGrid.innerHTML = '';

      if (items.length === 0) {
        productsGrid.innerHTML = `
          <div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-500 border border-slate-200">
            <i class="fa-solid fa-box-open text-4xl mb-3 text-slate-300"></i>
            <p class="font-medium">Sizning so'rovingizga mos mahsulot topilmadi.</p>
          </div>
        `;
        return;
      }

      items.forEach(product => {
        const discountPercentage = product.oldPrice 
          ? Math.round(((product.oldPrice - product.price) / product.oldPrice) * 100) 
          : null;

        const card = document.createElement('div');
        card.className = "bg-white rounded-xl border border-slate-200 p-4 flex flex-col justify-between hover:shadow-lg transition duration-200 group";
        card.innerHTML = `
          <div>
            <div class="h-44 w-full flex items-center justify-center p-2 mb-3 bg-slate-50 rounded-lg overflow-hidden relative">
              ${discountPercentage ? `<span class="absolute top-2 left-2 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">-${discountPercentage}% TEJANG</span>` : ''}
              <img src="${product.image}" alt="${product.title}" class="max-h-full max-w-full object-contain group-hover:scale-105 transition duration-300">
            </div>

            <div class="flex items-center gap-1 text-amber-400 text-xs mb-1.5">
              <i class="fa-solid fa-star"></i>
              <span class="font-semibold text-slate-700 ml-1">${product.rating}</span>
              <span class="text-slate-400">(${product.reviewsCount})</span>
            </div>

            <h3 class="font-bold text-slate-800 text-sm leading-snug mb-1 line-clamp-2 hover:text-blue-600 cursor-pointer" onclick="openDetailModal(${product.id})">
              ${product.title}
            </h3>
            <p class="text-xs text-slate-500 line-clamp-2 mb-4">${product.description}</p>
          </div>

          <div>
            <div class="mb-3">
              ${product.oldPrice ? `<span class="text-xs text-slate-400 line-through mr-1">$${product.oldPrice.toFixed(2)}</span>` : ''}
              <span class="text-lg font-bold text-slate-900">$${product.price.toFixed(2)}</span>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs">
              <button onclick="openDetailModal(${product.id})" class="border border-slate-200 text-slate-700 font-semibold py-2 rounded-lg hover:bg-slate-50 transition">
                Tafsilotlar
              </button>
              <button onclick="addToCart(${product.id})" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition shadow-md shadow-blue-500/10">
                Savatchaga
              </button>
            </div>
          </div>
        `;
        productsGrid.appendChild(card);
      });
    }

    // Filtrlash va saralash mantigi
    function filterAndSortProducts() {
      let filtered = [...products];

      // Qidiruv
      const query = searchInput.value.toLowerCase().trim();
      if (query) {
        filtered = filtered.filter(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
      }

      // Narx
      const min = parseFloat(minPrice.value);
      const max = parseFloat(maxPrice.value);
      if (!isNaN(min)) filtered = filtered.filter(p => p.price >= min);
      if (!isNaN(max)) filtered = filtered.filter(p => p.price <= max);

      // Rang turi
      const selectedColors = Array.from(document.querySelectorAll('.color-filter:checked')).map(cb => cb.value);
      if (selectedColors.length > 0) {
        filtered = filtered.filter(p => selectedColors.includes(p.colorType));
      }

      // Xususiyatlar
      const selectedFeatures = Array.from(document.querySelectorAll('.feature-filter:checked')).map(cb => cb.value);
      if (selectedFeatures.length > 0) {
        filtered = filtered.filter(p => selectedFeatures.every(f => p.features.includes(f)));
      }

      // Saralash
      const sortValue = sortBy.value;
      if (sortValue === 'price-low') filtered.sort((a, b) => a.price - b.price);
      if (sortValue === 'price-high') filtered.sort((a, b) => b.price - a.price);
      if (sortValue === 'rating') filtered.sort((a, b) => b.rating - a.rating);

      renderProducts(filtered);
    }

    // Event Listeners for Filters
    searchInput.addEventListener('input', filterAndSortProducts);
    sortBy.addEventListener('change', filterAndSortProducts);
    minPrice.addEventListener('input', filterAndSortProducts);
    maxPrice.addEventListener('input', filterAndSortProducts);
    document.querySelectorAll('.color-filter, .feature-filter').forEach(cb => cb.addEventListener('change', filterAndSortProducts));

    resetFiltersBtn.addEventListener('click', () => {
      searchInput.value = '';
      minPrice.value = '';
      maxPrice.value = '';
      sortBy.value = 'default';
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
      filterAndSortProducts();
    });

    // SAVATCHA MANTIGI
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);

      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const cartBadge = document.getElementById('cartBadge');
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');

      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      cartBadge.textContent = totalItems;
      cartBadge.classList.toggle('hidden', totalItems === 0);

      cartItems.innerHTML = cart.length === 0 
        ? `<p class="text-center text-slate-400 py-8">Savatchangiz bo'sh</p>`
        : cart.map(item => `
          <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
            <img src="${item.image}" alt="${item.title}" class="w-12 h-12 object-contain bg-white p-1 rounded">
            <div class="flex-1">
              <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${item.title}</h4>
              <span class="text-xs text-blue-600 font-bold">$${item.price.toFixed(2)}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-white border text-xs font-bold rounded hover:bg-slate-100">-</button>
              <span class="text-xs font-bold">${item.quantity}</span>
              <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-white border text-xs font-bold rounded hover:bg-slate-100">+</button>
            </div>
          </div>
        `).join('');

      cartTotal.textContent = `$${totalPrice.toFixed(2)}`;
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.id !== id);
        }
      }
      updateCartUI();
    }

    // MODAL OYNALAR MANTIGI
    const detailModal = document.getElementById('detailModal');
    const modalContent = document.getElementById('modalContent');
    const cartModal = document.getElementById('cartModal');

    function openDetailModal(id) {
      const product = products.find(p => p.id === id);
      modalContent.innerHTML = `
        <div class="flex flex-col md:flex-row gap-6">
          <div class="w-full md:w-1/2 bg-slate-50 p-4 rounded-xl flex items-center justify-center">
            <img src="${product.image}" class="max-h-64 object-contain">
          </div>
          <div class="w-full md:w-1/2 flex flex-col justify-between">
            <div>
              <span class="text-xs bg-blue-100 text-blue-700 font-bold px-2 py-1 rounded-full">${product.colorType}</span>
              <h2 class="font-bold text-xl text-slate-900 mt-2 mb-1">${product.title}</h2>
              <p class="text-xs text-slate-500 mb-3">${product.subtitle}</p>
              <p class="text-sm text-slate-600 mb-4">${product.description}</p>
            </div>
            <div>
              <div class="text-2xl font-bold text-slate-900 mb-4">$${product.price.toFixed(2)}</div>
              <button onclick="addToCart(${product.id}); detailModal.classList.add('hidden');" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">
                Savatchaga Qo'shish
              </button>
            </div>
          </div>
        </div>
      `;
      detailModal.classList.remove('hidden');
    }

    document.getElementById('closeModal').addEventListener('click', () => detailModal.classList.add('hidden'));
    document.getElementById('cartBtn').addEventListener('click', () => cartModal.classList.remove('hidden'));
    document.getElementById('closeCart').addEventListener('click', () => cartModal.classList.add('hidden'));

    // Boshlang'ich yuklash
    renderProducts(products);
  </script>
</body>
</html>
